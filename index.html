<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Library</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
        }

        /* Search Bar Styles */
        #searchBar {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* List Styles */
        #pdf-list {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 600px;
        }

        .pdf-item {
            background: var(--card-bg);
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-item:hover {
            transform: translateY(-3px);
        }

        .pdf-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .download-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .download-btn:hover {
            background-color: #2980b9;
        }

        /* Helper for empty search results */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Document Archive</h1>
        <input type="text" id="searchBar" placeholder="Search for a document..." onkeyup="filterList()">
    </header>

    <ul id="pdf-list">
        <li class="pdf-item">
            <a href="files/example-document.pdf" class="pdf-link" target="_blank">Example Document</a>
            <a href="files/example-document.pdf" class="download-btn" download>Download</a>
        </li>

        <li class="pdf-item">
            <a href="files/notes-2024.pdf" class="pdf-link" target="_blank">Class Notes 2024</a>
            <a href="files/notes-2024.pdf" class="download-btn" download>Download</a>
        </li>

        </ul>

    <script>
        function filterList() {
            const input = document.getElementById('searchBar');
            const filter = input.value.toLowerCase();
            const ul = document.getElementById("pdf-list");
            const li = ul.getElementsByTagName('li');

            for (let i = 0; i < li.length; i++) {
                const a = li[i].getElementsByClassName("pdf-link")[0];
                const txtValue = a.textContent || a.innerText;
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    li[i].classList.remove("hidden");
                } else {
                    li[i].classList.add("hidden");
                }
            }
        }
    </script>
</body>
</html>
