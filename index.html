<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Archive</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #333;
            --text-secondary: #666;
            --accent: #3498db;
            --hover-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-primary);
        }

        /* HEADER STYLING */
        header {
            /* UPDATED: Uses banner.png */
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('banner.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: white;
            padding: 4rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { 
            margin: 0; 
            font-size: 3rem; 
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .search-container {
            margin-top: 25px;
        }

        #search {
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        #pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background-color: #e74c3c;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-pdf {
            width: 40px;
            height: 40px;
            background: #ffebeb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e74c3c;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 15px;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Archive</h1>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search documents..." onkeyup="filterDocs()">
        </div>
    </header>

    <main>
        <div id="loading">Scanning library...</div>
        <div id="pdf-grid"></div>
    </main>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const USERNAME = 'SlothUS'; 
        const REPO_NAME = 'SlothUS.github.io';
        const FOLDER_NAME = 'files'; 
        // ==========================================

        const grid = document.getElementById('pdf-grid');
        const loading = document.getElementById('loading');

        async function fetchPDFs() {
            try {
                // Construct the API URL
                const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO_NAME}/contents/${FOLDER_NAME}`;
                
                const response = await fetch(apiUrl);
                
                // ERROR HANDLING: Why is it stuck?
                if (response.status === 404) throw new Error(`Folder "files" not found. Check your repo structure.`);
                if (response.status === 403) throw new Error('API Rate Limit Exceeded. Wait 1 hour or try different wifi.');
                if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
                
                const files = await response.json();
                const pdfs = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));

                loading.style.display = 'none';

                if (pdfs.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; width:100%">Folder found, but no PDF files inside.</p>';
                    return;
                }

                pdfs.forEach(pdf => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = pdf.download_url;
                    card.target = '_blank';
                    
                    const displayName = pdf.name.replace('.pdf', '').replace(/[-_]/g, ' ');
                    const sizeKB = (pdf.size / 1024).toFixed(1) + ' KB';

                    card.innerHTML = `
                        <div class="icon-pdf">PDF</div>
                        <div class="card-title">${displayName}</div>
                        <div class="card-meta">
                            <span>${sizeKB}</span>
                            <span>Download &rarr;</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                loading.innerText = '⚠️ Error: ' + error.message;
                loading.style.color = 'red';
            }
        }

        function filterDocs() {
            const search = document.getElementById('search').value.toLowerCase();
            const cards = document.getElementsByClassName('card');

            Array.from(cards).forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                if (title.includes(search)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        fetchPDFs();
    </script>
</body>
</html>
